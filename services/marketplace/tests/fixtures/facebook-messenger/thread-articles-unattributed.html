<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic article conversation</title></head>
<body>
  <!-- Only role/attribute structure is based on the 2026-10-11 observation.
       All text, counts, identities, and attachment representations are synthetic. -->
  <main role="main">
    <header><span aria-label="Your account">Synthetic account</span></header>
    <div role="grid">
      <div role="row"><div role="gridcell">Synthetic navigation entry</div></div>
    </div>
    <div role="log" aria-label="Synthetic messages" aria-live="polite" id="synthetic-log">
      <div role="article" class="synthetic" style="display: block">
        <div><span>Synthetic message [synthetic-reply-token]</span></div>
        <div role="none"><div role="toolbar" aria-label="Synthetic message actions"></div></div>
      </div>
      <div role="article" class="synthetic" style="display: block">
        <div><div role="img" aria-label="Synthetic attachment"></div></div>
        <div role="none"><div role="toolbar" aria-label="Synthetic message actions"></div></div>
      </div>
    </div>
    <div role="textbox" contenteditable="true" aria-label="Synthetic composer"></div>
  </main>
</body>
</html>
