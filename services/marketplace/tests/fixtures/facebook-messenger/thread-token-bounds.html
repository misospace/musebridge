<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic token boundaries</title></head>
<body><main role="main">
  <span aria-label="Your account">Synthetic account</span>
  <section id="synthetic-messages"></section>
</main>
<script>
  const token = '[synthetic-reply-token]';
  const content = [
    ['You said: synthetic', 'X'.repeat(2000 - token.length) + token, '2026-09-14T10:30:00Z'],
    ['Synthetic Seller said: synthetic', 'Quoted ' + token, '2026-09-14T10:31:00Z'],
    ['You said: synthetic', 'X'.repeat(2000) + token, '2026-09-14T10:32:00Z'],
    ['Unattributed message', token, '2026-09-14T10:33:00Z']
  ];
  for (const [label, text, sentAt] of content) {
    const row = document.createElement('div');
    row.setAttribute('role', 'row');
    row.setAttribute('aria-label', label);
    row.textContent = text;
    // The explicit timestamp is the only evidence of the message's place in the thread's
    // timeline, so every attributed row carries one.
    const time = document.createElement('time');
    time.setAttribute('datetime', sentAt);
    row.append(time);
    document.getElementById('synthetic-messages').append(row);
  }
</script>
</body></html>
